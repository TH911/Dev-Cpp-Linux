name: NOI Linux 2.0 compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_beta:
        description: 'Publish after this manual check (beta pushes publish automatically)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publishing-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify automatic and manual beta publishing rules
        run: node --test tests/publish-beta-test.cjs

  build-and-run:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
    steps:
      - name: Prepare checkout
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the NOI Linux 2.0 toolchain
        run: bash ci/install-dependencies.sh
      - name: Build, run regressions as an ordinary user, and verify installation
        run: bash ci/build-and-package.sh
      - name: Upload source archives and tested Debian package
        uses: actions/upload-artifact@v4
        with:
          name: devcpp-noi-linux-2.0-amd64
          path: |
            dist/linux-noi-lazarus-*-src.zip
            dist/linux-noi-lazarus-*-src.tar.gz
            dist/devcpp-noi_*_amd64.deb
          if-no-files-found: error

  publish-beta:
    needs: [build-and-run, publishing-rules]
    if: github.ref == 'refs/heads/beta' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_beta == true))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: beta-prerelease-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: devcpp-noi-linux-2.0-amd64
          path: dist
      - name: Publish the verified beta as a Pre-release
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/publish-beta.cjs')({github, context, core});
