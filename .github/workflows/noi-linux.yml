name: NOI Linux 2.0 compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
    steps:
      - name: Prepare checkout
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the NOI Linux 2.0 toolchain
        run: bash ci/install-dependencies.sh
      - name: Build, run regressions as an ordinary user, and verify installation
        run: bash ci/build-and-package.sh
      - name: Upload source archives and tested Debian package
        uses: actions/upload-artifact@v4
        with:
          name: devcpp-noi-linux-2.0-amd64
          path: |
            dist/linux-noi-lazarus-*-src.zip
            dist/linux-noi-lazarus-*-src.tar.gz
            dist/devcpp-noi_*_amd64.deb
          if-no-files-found: error
